<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | NFT preview card component</title>


</head>

<body>
  <div class="wrapper">
    <div class="card">
      <div class="image">
        <img src="images/image-equilibrium.jpg" alt="nft-image" class="nft-image">
        <div class="overlay"></div>
      </div>
      <div>
        <h2>Equilibrium #3429</h2>
        
      </div>

      <div class="paragraph">
        <p>Our Equilibrium collection promotes balance and calm</p>
      </div>

      <div class="wrapper-two">
        <div class="eth-icon">
          <img src="images/icon-ethereum.svg" alt="Ethereum Icon" class="eth-icon">
          <p class="eth-number">0.041 ETH</p>
        </div>
        <div class="days">
          <img src="images/icon-clock.svg" alt="Clock Icon" class="clock-icon">
          <p class="days-left">3 days left</p>
        </div>
      </div> 
<hr>
      <div class="profile">
        <div class="content">
          <img src="images/troy71.jpg" alt="Avatar" class="avatar">
          <p class="profile-text">Creation of <span class="name">troy71</span></p>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
